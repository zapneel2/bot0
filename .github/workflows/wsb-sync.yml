name: Sync WSB to X Gist Queue

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch:       # Allows manual "Run workflow" button testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python -c 'import urllib.request; [print(u, urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"})).status) for u in ["https://reddit.com", "https://photon-reddit.com"]]'

