name: Ping Jito Regions

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Jito IPs
        run: |
          python3 -c 'import subprocess, re; ips = [("Amsterdam", "74.118.140.240"), ("Dublin", "64.130.61.8"), ("Frankfurt", "64.130.50.14"), ("London", "64.130.46.153"), ("New York", "141.98.216.96"), ("Salt Lake City", "64.130.53.8"), ("Singapore", "202.8.11.224"), ("Tokyo", "202.8.9.160")]; [print(f"{name:15} ({ip:15}): " + (m.group(1) + " ms" if (m := re.search(r"min/avg/max(?:/mdev)?\s*=\s*[\d.]+/([\d.]+)", subprocess.run(["ping", "-c", "5", ip], capture_output=True, text=True).stdout)) else "timeout/blocked")) for name, ip in ips]'
